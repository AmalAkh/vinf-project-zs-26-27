
services:
  spark-master:
    image: apache/spark:4.2.1-scala2.13-java17-python3-r-ubuntu
    container_name: spark-master
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8080:8080"
    networks:
      - spark-net
    volumes:
      - ../data/spark_input/:/Users/amalakhmadinurov/Desktop/ZS_2026_2027/VINF/Project/data/spark_input:ro
      - ../data/spark_output/:/Users/amalakhmadinurov/Desktop/ZS_2026_2027/VINF/Project/data/spark_output:rw


  spark-worker:
    image: apache/spark:4.2.1-scala2.13-java17-python3-r-ubuntu
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - 1G
      - spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - spark-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data/spark_input/:/Users/amalakhmadinurov/Desktop/ZS_2026_2027/VINF/Project/data/spark_input:ro
      - ../data/spark_output/:/Users/amalakhmadinurov/Desktop/ZS_2026_2027/VINF/Project/data/spark_output:rw


networks:
  spark-net:
    driver: bridge
